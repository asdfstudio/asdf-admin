name: Deploy Airly_Admin

on:
  push:
    branches: [ develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:       
    - name: Deploy Airly_Admin
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        script: |
          cd /var/www/airly_admin/
          git pull origin develop
          npm install
          npm run build
          nginx -t
          systemctl restart nginx
